version: 2

models:
  - name: dim_dates
    columns:
      - name: date_day
        data_tests: [unique, not_null]

  - name: dim_tokens
    columns:
      - name: token_address
        data_tests: [unique, not_null]

  - name: dim_addresses
    columns:
      - name: address
        data_tests: [unique, not_null]
      - name: address_segment
        data_tests:
          - accepted_values:
              arguments:
                values: ['whale', 'large', 'power_user', 'regular']

  - name: mart_daily_network_activity
    columns:
      - name: block_date
        data_tests: [unique, not_null]

  - name: mart_daily_gas_fees
    columns:
      - name: block_date
        data_tests: [unique, not_null]

  - name: mart_hourly_gas_fees
    columns:
      - name: block_hour
        data_tests: [unique, not_null]

  - name: mart_tx_category_daily
    columns:
      - name: tx_category
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['contract_creation', 'eth_transfer', 'erc20_transfer', 'erc20_approve', 'contract_call']

  - name: mart_address_segments
    columns:
      - name: address_segment
        data_tests: [unique, not_null]

  - name: mart_contract_popularity
    columns:
      - name: contract_address
        data_tests: [unique, not_null]

  - name: mart_top_tokens
    columns:
      - name: token_address
        data_tests: [unique, not_null]

  - name: mart_top_event_emitters
    columns:
      - name: contract_address
        data_tests: [unique, not_null]

  - name: mart_block_production_daily
    columns:
      - name: block_date
        data_tests: [unique, not_null]

  - name: mart_block_builders
    columns:
      - name: fee_recipient
        data_tests: [unique, not_null]
